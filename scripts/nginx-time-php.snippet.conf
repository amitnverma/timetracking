# Paste into CloudPanel → Sites → cloudmosaic.ai → Vhost/Nginx → Additional Nginx Directives
# Then save & reload. Affects /time only; other sites unchanged.
# PHP-FPM for cloudmosaic.ai on this VPS listens on 127.0.0.1:20003 (pool cloudmosaic.ai).

location ^~ /time/ {
    root /home/cloudmosaicai/htdocs/cloudmosaic.ai;
    index index.html index.php;
    try_files $uri $uri/ =404;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:20003;
        fastcgi_read_timeout 60s;
    }
}
