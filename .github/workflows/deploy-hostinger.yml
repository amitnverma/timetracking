name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-time
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy only to time folder on Hostinger
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # Sync only into the target directory. Excluded remote files are not deleted.
          switches: >-
            -avz
            --delete
            --exclude .git
            --exclude .github
            --exclude .gitignore
            --exclude .DS_Store
            --exclude config/db.local.php
            --exclude config/db.local.php.example
          path: ./
          remote_path: /home/cloudmosaicaissh/htdocs/cloudmosaic.ai/time/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
